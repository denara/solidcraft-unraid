[package]
name = "solidcraft-workspace"
description = "Small Rust browser client for the read-only SolidCraft workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlDialogElement", "HtmlDetailsElement",
    "HtmlAnchorElement", "HtmlImageElement", "Event", "EventTarget", "EventSource", "MessageEvent", "MouseEvent",
    "Location", "Response", "DomParser", "SupportedType", "Node", "NodeList",
] }
